<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DANUWA-MD SESSION</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
      :root { --primary-color: #000000; --background-color: #ffffff; --hover-color: #f5f5f5; --border-color: rgba(0, 0, 0, 0.1); }
      body { font-family: "Inter", sans-serif; background: var(--background-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
      .container { width: 100%; max-width: 400px; padding: 25px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); border: 1px solid var(--border-color); text-align: center; }
      input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; text-align: center; font-size: 16px; }
      button { width: 100%; padding: 12px; background: var(--primary-color); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
      #codeDisplay { font-size: 32px; font-weight: bold; letter-spacing: 5px; margin: 20px 0; color: #27ae60; display: none; }
      .loading { display: none; margin: 20px 0; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo" style="font-size: 40px;"><i class="fas fa-robot"></i></div>
      <h2>DANUWA-MD</h2>
      <p>Enter number with country code (e.g. 94712345678)</p>
      
      <input type="number" id="phoneNumber" placeholder="947xxxxxxxx" />
      <button onclick="generatePairingCode()">Get Pairing Code</button>

      <div class="loading" id="loading"><i class="fas fa-spinner fa-spin"></i> Requesting...</div>
      <div id="codeDisplay"></div>
      <div id="status"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
    <script>
      async function generatePairingCode() {
        const number = document.getElementById("phoneNumber").value;
        const codeDisplay = document.getElementById("codeDisplay");
        const status = document.getElementById("status");
        const loading = document.getElementById("loading");

        if (!number) return alert("Please enter your phone number!");

        loading.style.display = "block";
        codeDisplay.style.display = "none";
        status.innerHTML = "";

        try {
          const response = await axios.get(`/pair?number=${number}`);
          if (response.data.code) {
            codeDisplay.innerText = response.data.code;
            codeDisplay.style.display = "block";
            status.innerHTML = "<p style='color:green'>Enter this code on your phone's Linked Devices menu.</p>";
          }
        } catch (error) {
          status.innerHTML = "<p style='color:red'>Error: " + (error.response?.data?.error || "Connection failed") + "</p>";
        } finally {
          loading.style.display = "none";
        }
      }
    </script>
  </body>
</html>
